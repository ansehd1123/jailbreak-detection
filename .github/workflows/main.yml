name: Build IPA with Custom Icon

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: 소스코드 가져오기
      uses: actions/checkout@v4

    - name: 앱 아이콘 자동 생성 및 리사이징
      run: |
        if [ -f "icon.png" ]; then
          echo "Found icon.png, resizing for iOS..."
          # macOS 기본 툴(sips)을 이용해 iOS 필수 아이콘 규격으로 자동 변환
          sips -z 120 120 icon.png --out Payload/JailbreakDetector.app/Icon-60@2x.png
          sips -z 180 180 icon.png --out Payload/JailbreakDetector.app/Icon-60@3x.png
          sips -z 76 76 icon.png --out Payload/JailbreakDetector.app/Icon-76.png
          sips -z 152 152 icon.png --out Payload/JailbreakDetector.app/Icon-76@2x.png
        else
          echo "Warning: icon.png not found, skipping icon generation."
        fi

    - name: iOS 앱 직접 컴파일 및 IPA 패키징
      run: |
        mkdir -p Payload/JailbreakDetector.app
        
        # iOS SDK 경로 가져오기
        SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
        
        # 저장소 내의 모든 .swift 파일을 자동으로 찾기
        SWIFT_FILES=$(find . -name "*.swift")
        
        # Swift 파일 컴파일
        swiftc -target arm64-apple-ios15.0 \
          -sdk "$SDK_PATH" \
          -parse-as-library \
          -framework UIKit \
          -framework SwiftUI \
          -framework Foundation \
          -framework Network \
          $SWIFT_FILES \
          -o Payload/JailbreakDetector.app/JailbreakDetector
          
        # 바이너리 파일에 실행 권한 부여
        chmod +x Payload/JailbreakDetector.app/JailbreakDetector
          
        # 필수 Info.plist 생성 (앱 아이콘 설정 CFBundleIcons 추가)
        cat << 'EOF' > Payload/JailbreakDetector.app/Info.plist
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>CFBundleIdentifier</key>
            <string>com.security.jailbreakdetector</string>
            <key>CFBundleName</key>
            <string>JailbreakDetector</string>
            <key>CFBundleDisplayName</key>
            <string>JailbreakDetector</string>
            <key>CFBundleExecutable</key>
            <string>JailbreakDetector</string>
            <key>CFBundleIcons</key>
            <dict>
                <key>CFBundlePrimaryIcon</key>
                <dict>
                    <key>CFBundleIconFiles</key>
                    <array>
                        <string>Icon-60</string>
                        <string>Icon-76</string>
                    </array>
                </dict>
            </dict>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0</string>
            <key>CFBundleVersion</key>
            <string>1</string>
            <key>MinimumOSVersion</key>
            <string>15.0</string>
            <key>UIDeviceFamily</key>
            <array>
                <integer>1</integer>
            </array>
        </dict>
        </plist>
        EOF
        
        # IPA 파일로 압축
        zip -r JailbreakDetector.ipa Payload

    - name: 완성된 IPA 업로드
      uses: actions/upload-artifact@v4
      with:
        name: JailbreakDetector-IPA
        path: JailbreakDetector.ipa
